services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: botarena
      POSTGRES_USER: botarena
      POSTGRES_PASSWORD: botarena
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - botarena-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botarena -d botarena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botarena-postgres:
